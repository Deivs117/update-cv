name: CI

# Portero de calidad mínimo antes de mergear: valida que web/ compile y pase
# lint/typecheck/test (#65, unit tests con Vitest -- ver vitest.config.mts).
# No implementa deploy.
on:
  push:
    branches: [main, "feature/**"]
  pull_request:

# Principio de menor privilegio (#71, hardening de GitHub Actions): el
# GITHUB_TOKEN de este workflow solo necesita leer el repo, nunca escribir --
# explícito acá para no depender del default a nivel de repo/org.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend (web/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # Actions pinneadas a SHA completo (#71): un tag mayor puede
      # reapuntarse, un SHA no -- es la única forma de que la referencia sea
      # un release inmutable (ver guía de hardening de GitHub Actions).
      # Dependabot (.github/dependabot.yml) abre el PR para actualizar el SHA
      # cuando salga una versión nueva.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
