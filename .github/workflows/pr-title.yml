# Valida en CI que el título del PR siga Conventional Commits (tipo: mensaje),
# como espejo del hook local de .pre-commit-config.yaml para quien no lo tenga
# instalado — ver CLAUDE.md.
name: PR title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            style
            perf
            ci
          requireScope: false
