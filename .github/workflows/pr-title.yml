# Valida en CI que el título del PR siga Conventional Commits (tipo: mensaje),
# como espejo del hook local de .pre-commit-config.yaml para quien no lo tenga
# instalado — ver CLAUDE.md.
name: PR title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      # Pinneada a SHA completo (#71): third-party y corre en
      # pull_request_target -- es la que más importa fijar de las 3 en uso.
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            style
            perf
            ci
          requireScope: false
