# Code scanning sobre el código propio (#76) -- distinto de Dependabot
# (#71, dependencias de terceros) y Dependency Review (#72, diff de
# dependencias en un PR): CodeQL analiza lo que escribimos nosotros
# buscando patrones de vulnerabilidad conocidos (inyección, uso inseguro de
# regex, etc.).
#
# build-mode: none -- JavaScript/TypeScript no necesita un paso de build
# para la extracción (a diferencia de lenguajes compilados), CodeQL analiza
# el código fuente directo.
name: "CodeQL"

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
  schedule:
    # Semanal (lunes 03:00 UTC) -- detecta advisories nuevos contra código
    # que no cambió, no solo lo que trae cada PR.
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bd7200e1f146b1c937cae12d258b50f41a53cf8 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
